<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <g font-family="sans-serif" font-size="13px" fill="#0A0A0A">
    <rect width="900" height="320" fill="#ECEBE4"/>

    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#17482E"/>
      </marker>
    </defs>

    <g transform="translate(30, 135)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#D0D0C4" stroke="#0A0A0A" stroke-width="1.5"/>
      <text x="50" y="29" font-weight="bold" text-anchor="middle">Raw Data</text>
    </g>
    <path d="M 130 160 L 170 160" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow)"/>

    <rect x="170" y="40" width="560" height="240" rx="6" fill="#FFFFFF" stroke="#17482E" stroke-width="2.5"/>
    
    <rect x="170" y="40" width="560" height="35" rx="6" fill="#17482E"/>
    <rect x="170" y="55" width="560" height="20" fill="#17482E"/>
    <text x="185" y="62" fill="#FFFFFF" font-weight="bold" font-size="15px">Scikit-Learn Pipeline Object Container</text>

    <g transform="translate(195, 110)">
      <rect x="0" y="0" width="130" height="90" rx="6" fill="#ECEBE4" stroke="#27784C" stroke-width="2"/>
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#27784C"/>
      <rect x="0" y="15" width="130" height="13" fill="#27784C"/>
      <text x="65" y="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Step 1: Imputer</text>
      <text x="65" y="52" font-weight="bold" text-anchor="middle">Strategy:</text>
      <text x="65" y="70" text-anchor="middle">median</text>
    </g>

    <path d="M 325 155 L 365 155" stroke="#17482E" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(365, 110)">
      <rect x="0" y="0" width="130" height="90" rx="6" fill="#ECEBE4" stroke="#27784C" stroke-width="2"/>
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#27784C"/>
      <rect x="0" y="15" width="130" height="13" fill="#27784C"/>
      <text x="65" y="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Step 2: Scaler</text>
      <text x="65" y="52" font-weight="bold" text-anchor="middle">Method:</text>
      <text x="65" y="70" text-anchor="middle">StandardScaler</text>
    </g>

    <path d="M 495 155 L 535 155" stroke="#17482E" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(535, 110)">
      <rect x="0" y="0" width="165" height="90" rx="6" fill="#F1FFD5" stroke="#17482E" stroke-width="2"/>
      <rect x="0" y="0" width="165" height="28" rx="6" fill="#17482E"/>
      <rect x="0" y="15" width="165" height="13" fill="#17482E"/>
      <text x="82.5" y="18" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Step 3: Estimator</text>
      <text x="82.5" y="55" font-weight="bold" text-anchor="middle" fill="#17482E">RandomForest</text>
      <text x="82.5" y="72" font-weight="bold" text-anchor="middle" fill="#17482E">Regressor</text>
    </g>

    <path d="M 730 160 L 770 160" stroke="#17482E" stroke-width="2.5" marker-end="url(#arrow)"/>
    <g transform="translate(770, 135)">
      <rect x="0" y="0" width="100" height="50" rx="6" fill="#D7FF94" stroke="#17482E" stroke-width="1.5"/>
      <text x="50" y="29" font-weight="bold" fill="#17482E" text-anchor="middle">Predictions</text>
    </g>
  </g>
</svg>
